<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lazyloading</title>
    <link rel="stylesheet" href="styles/lazy.css">
    <script src="scripts/lazy.js" defer></script>
</head>
<body>
    <main>
        <h1>lazyloading of cats and meows</h1>

      <div>
        <img src="images/history.jpg" alt="food" loading="lazy" width="400px" height="600px">
        <img src="images/history.jpg" alt="dot" loading="lazy" width="400px" height="600px">
        <img src="images/history.jpg" alt="move" loading="lazy" width="400px" height="600px">
        <img src="images/history.jpg" alt="solid" loading="lazy" width="400px" height="600px">
        <img src="images/history.jpg" alt="djd" loading="lazy" width="400px" height="600px">
        <img src="images/history.jpg" alt="kss" loading="lazy" width="400px" height="600px">

      </div>
    </main>

    <footer>
        <p id="food">Richmond Amankwah</p>
        <p id="solid">lastmodified: today</p>
    </footer>
    
</body>
</html>
